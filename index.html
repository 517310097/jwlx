<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字母下落 · 语音朗读版</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #1e2b3c, #0f141c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', Courier, monospace;
        }
        .game-container {
            background: #2d3b4e;
            padding: 30px 40px 40px 40px;
            border-radius: 50px;
            box-shadow: 
                0 25px 40px rgba(0,0,0,0.8),
                inset 0 -5px 10px rgba(0,0,0,0.6),
                inset 0 5px 15px rgba(255,255,255,0.08);
            border-bottom: 8px solid #1a212b;
        }
        .screen {
            background: #0a0e14;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 
                inset 0 0 0 4px #1e2733,
                inset 0 0 40px #000000,
                0 10px 0 #11161f;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        canvas#gameCanvas {
            background: #0a0e14;
            border-radius: 16px;
            display: block;
            width: 100%;
            max-width: 700px;
            height: auto;
            box-shadow: 0 0 0 2px #2d3b4e;
            cursor: default;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
            padding: 0 10px;
            color: #b8d4ff;
            font-weight: bold;
            text-shadow: 0 2px 0 #0a0e14;
        }
        .score-box, .miss-box, .level-box {
            background: #141b24;
            padding: 8px 18px;
            border-radius: 40px;
            box-shadow: inset 0 0 0 2px #2c3a4a, 0 4px 0 #0a0e14;
            font-size: 20px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .score-box span, .miss-box span, .level-box span {
            color: #7f9fcf;
            font-size: 16px;
        }
        .score-box strong, .miss-box strong, .level-box strong {
            color: #e0f0ff;
            font-size: 26px;
            font-weight: 900;
            text-shadow: 0 0 10px #5f9fff;
        }
        .miss-box strong {
            color: #ff9f9f;
            text-shadow: 0 0 10px #ff5f5f;
        }
        .level-selector {
            display: flex;
            gap: 4px;
            margin-left: 5px;
        }
        .level-btn {
            background: #1e2b3c;
            border: none;
            color: #7f9fcf;
            font-weight: bold;
            font-size: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 3px 0 #0a0e14;
            transition: all 0.08s;
            font-family: 'Courier New', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .level-btn.active {
            background: #3a5a8a;
            color: #ffffff;
            box-shadow: 0 3px 0 #1a2a4a, 0 0 12px #5f9fff;
        }
        .level-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0a0e14;
        }
        .level-btn:hover {
            background: #2a4060;
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 18px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background: #232f3e;
            border: none;
            color: #d0e4ff;
            font-weight: bold;
            font-size: 20px;
            padding: 12px 35px;
            border-radius: 50px;
            box-shadow: 0 6px 0 #0f141c, 0 8px 15px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: all 0.08s;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0f141c, 0 5px 10px rgba(0,0,0,0.5);
        }
        .btn:hover {
            background: #2f3e52;
        }
        .btn.pause {
            background: #2e3f4e;
            color: #ffe48f;
        }
        .hint {
            color: #6d7f97;
            font-size: 15px;
            margin-top: 12px;
            letter-spacing: 1px;
            text-align: center;
        }
        .hint kbd {
            background: #232f3e;
            padding: 3px 10px;
            border-radius: 20px;
            color: #b8d4ff;
            font-weight: bold;
            font-size: 16px;
            box-shadow: inset 0 -1px 0 #0f141c, 0 2px 0 #0f141c;
            margin: 0 3px;
        }
        .overlay-pause {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #232f3e;
            box-shadow: 0 6px 0 #0f141c, 0 8px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffd966;
            font-size: 28px;
            cursor: pointer;
            border: none;
            transition: all 0.08s;
            z-index: 10;
        }
        .overlay-pause:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0f141c, 0 5px 10px rgba(0,0,0,0.5);
        }
        .overlay-pause:hover {
            background: #2f4058;
        }
        .voice-indicator {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: #141b24;
            padding: 8px 18px;
            border-radius: 30px;
            box-shadow: inset 0 0 0 2px #2c3a4a;
            color: #8aa8d0;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }
        .voice-indicator .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #5f9fff;
            box-shadow: 0 0 10px #5f9fff;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        /* 手别指示器 */
        .hand-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #141b24;
            padding: 8px 22px;
            border-radius: 30px;
            box-shadow: inset 0 0 0 2px #2c3a4a, 0 4px 10px rgba(0,0,0,0.4);
            color: #b8d4ff;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        .hand-indicator .hand-tag {
            background: #3a5a8a;
            color: #fff;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 14px;
            box-shadow: 0 0 10px #5f9fff;
            transition: all 0.3s;
        }
        .hand-indicator .hand-tag.right {
            background: #8a5a3a;
            box-shadow: 0 0 10px #ffb366;
        }
        /* 切换倒计时 */
        .hand-indicator .countdown {
            color: #6d8bb0;
            font-size: 13px;
            margin-left: 4px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="screen" id="screenContainer">
            <div class="status-bar">
                <div class="score-box"><span>得分</span><strong id="scoreDisplay">0</strong></div>
                <div class="miss-box"><span>失误</span><strong id="missDisplay">0</strong></div>
                <div class="level-box">
                    <span>等级</span>
                    <strong id="levelDisplay">1</strong>
                    <div class="level-selector">
                        <button class="level-btn active" data-level="1">1</button>
                        <button class="level-btn" data-level="2">2</button>
                        <button class="level-btn" data-level="3">3</button>
                    </div>
                </div>
            </div>
            <canvas id="gameCanvas" width="700" height="500"></canvas>
            <button class="overlay-pause" id="pauseBtn" title="暂停/继续">⏸</button>
            <div class="voice-indicator" id="voiceIndicator">
                <span class="dot"></span> 语音朗读
            </div>
            <!-- 当前手别指示 -->
            <div class="hand-indicator" id="handIndicator">
                当前: <span class="hand-tag" id="handTag">左手</span>
                <span class="countdown" id="countdown"></span>
            </div>
        </div>
        <div class="controls">
            <button class="btn" id="startBtn">开始游戏</button>
            <button class="btn pause" id="pauseToggleBtn">暂停</button>
            <button class="btn" id="resetBtn">重新开始</button>
        </div>
        <div class="hint">
            <kbd>A</kbd> ~ <kbd>Z</kbd> 按下对应字母消除并朗读 · 按 <kbd>空格</kbd> 可暂停/继续
        </div>
    </div>
    <script>
        (function() {
            // ---------- 配置 ----------
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const missDisplay = document.getElementById('missDisplay');
            const levelDisplay = document.getElementById('levelDisplay');
            const pauseBtn = document.getElementById('pauseBtn');
            const startBtn = document.getElementById('startBtn');
            const pauseToggleBtn = document.getElementById('pauseToggleBtn');
            const resetBtn = document.getElementById('resetBtn');
            const voiceIndicator = document.getElementById('voiceIndicator');
            const levelBtns = document.querySelectorAll('.level-btn');
            const handTag = document.getElementById('handTag');
            const countdown = document.getElementById('countdown');

            const CW = 700, CH = 500;
            canvas.width = CW;
            canvas.height = CH;

            // 字母参数
            const LETTER_RADIUS = 28;
            const UNIFIED_SPEED = 0.6;
            const SPAWN_INTERVAL = 150;
            const MAX_LETTERS_ON_SCREEN = 3;

            // ★ 左右手字母分组
            const LEFT_HAND_LETTERS = ['Q', 'W', 'E', 'R', 'T', 'A', 'S', 'D', 'F', 'G', 'Z', 'X', 'C', 'V', 'B'];
            const RIGHT_HAND_LETTERS = ['Y', 'U', 'I', 'O', 'P', 'H', 'J', 'K', 'L', 'N', 'M'];

            // ★ 切换周期：10分钟 = 600000 毫秒
            const SWITCH_INTERVAL_MS = 10 * 60 * 1000;

            // 颜色池
            const COLORS = [
                '#FF6B6B', '#4ECDC4', '#FFD93D', '#6C5CE7', '#A8E6CF',
                '#FF8C94', '#B5EAD7', '#FFB347', '#87CEEB', '#D4A5A5',
                '#9B59B6', '#F1C40F', '#2ECC71', '#E67E22', '#E74C3C'
            ];

            // ---------- 游戏状态 ----------
            let letters = [];
            let particles = [];
            let score = 0;
            let miss = 0;
            let level = 1;
            let gameActive = false;
            let paused = false;
            let gameOver = false;
            let frameCount = 0;
            let spawnCounter = 0;
            let animationFrame = null;

            // ★ 手别状态
            let currentHand = 'left';           // 'left' 或 'right'
            let handStartTime = 0;              // 当前手别开始的时间戳
            let handTimerInterval = null;       // 切换计时器

            // ---------- 语音朗读模块 ----------
            let speechSynth = window.speechSynthesis;
            let voiceEnabled = true;
            let voiceReady = false;

            function initSpeech() {
                if (!speechSynth) {
                    voiceIndicator.innerHTML = '<span style="color:#ff8f8f">✕ 语音不支持</span>';
                    voiceEnabled = false;
                    return;
                }
                speechSynth.getVoices();
                speechSynth.onvoiceschanged = function() {
                    voiceReady = true;
                };
                if (speechSynth.getVoices().length > 0) {
                    voiceReady = true;
                }
                setTimeout(() => {
                    if (!voiceReady) voiceReady = true;
                }, 1000);
            }

            function speakLetter(letter) {
                if (!voiceEnabled || !speechSynth) return;
                speechSynth.cancel();
                
                const utterance = new SpeechSynthesisUtterance(letter);
                utterance.lang = 'en-US';
                utterance.rate = 1.0;
                utterance.pitch = 1.2;
                utterance.volume = 0.9;
                
                const voices = speechSynth.getVoices();
                const englishVoice = voices.find(v => v.lang.startsWith('en-') && v.name.includes('Google')) ||
                                     voices.find(v => v.lang.startsWith('en-')) ||
                                     voices[0];
                if (englishVoice) {
                    utterance.voice = englishVoice;
                }
                
                speechSynth.speak(utterance);
            }

            // ★ 从当前手别字母池中随机取一个
            function randomLetterFromCurrentHand() {
                const pool = currentHand === 'left' ? LEFT_HAND_LETTERS : RIGHT_HAND_LETTERS;
                const code = Math.floor(Math.random() * pool.length);
                return pool[code];
            }

            function randomColor() {
                return COLORS[Math.floor(Math.random() * COLORS.length)];
            }

            function createLetter() {
                let char = randomLetterFromCurrentHand();
                // 避免屏幕上出现重复字母（最多尝试10次）
                let attempts = 0;
                let existing = letters.map(l => l.char);
                while (existing.includes(char) && attempts < 10) {
                    char = randomLetterFromCurrentHand();
                    if (!existing.includes(char)) break;
                    attempts++;
                }
                return makeLetter(char);
            }

            function makeLetter(char) {
                const x = Math.random() * (CW - LETTER_RADIUS * 2) + LETTER_RADIUS;
                return {
                    char: char,
                    x: x,
                    y: -LETTER_RADIUS,
                    color: randomColor(),
                    speed: UNIFIED_SPEED,
                    radius: LETTER_RADIUS,
                    opacity: 1,
                    active: true
                };
            }

            function spawnParticles(x, y, color) {
                for (let i = 0; i < 12; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 1.5 + Math.random() * 3;
                    particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1.0,
                        color: color,
                        size: 3 + Math.random() * 4
                    });
                }
            }

            function updateUI() {
                scoreDisplay.textContent = score;
                missDisplay.textContent = miss;
                levelDisplay.textContent = level;
                levelBtns.forEach(btn => {
                    const btnLevel = parseInt(btn.dataset.level);
                    if (btnLevel === level) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
                // 更新手别指示
                updateHandIndicator();
            }

            // ★ 更新手别指示器显示
            function updateHandIndicator() {
                if (currentHand === 'left') {
                    handTag.textContent = '左手';
                    handTag.classList.remove('right');
                } else {
                    handTag.textContent = '右手';
                    handTag.classList.add('right');
                }
            }

            // ★ 更新倒计时显示
            function updateCountdown() {
                if (!gameActive || paused || gameOver) {
                    countdown.textContent = '';
                    return;
                }
                const elapsed = Date.now() - handStartTime;
                const remaining = Math.max(0, SWITCH_INTERVAL_MS - elapsed);
                const mins = Math.floor(remaining / 60000);
                const secs = Math.floor((remaining % 60000) / 1000);
                countdown.textContent = `(还剩 ${mins}:${secs.toString().padStart(2, '0')})`;
            }

            // ★ 切换手别
            function switchHand() {
                currentHand = currentHand === 'left' ? 'right' : 'left';
                handStartTime = Date.now();
                updateHandIndicator();
                updateCountdown();
            }

            // ★ 启动手别计时器
            function startHandTimer() {
                stopHandTimer();
                // 重置手别为左手，记录开始时间
                currentHand = 'left';
                handStartTime = Date.now();
                updateHandIndicator();
                updateCountdown();

                handTimerInterval = setInterval(() => {
                    if (!gameActive || paused || gameOver) return;
                    updateCountdown();
                    const elapsed = Date.now() - handStartTime;
                    if (elapsed >= SWITCH_INTERVAL_MS) {
                        switchHand();
                    }
                }, 1000);
            }

            // ★ 停止手别计时器
            function stopHandTimer() {
                if (handTimerInterval) {
                    clearInterval(handTimerInterval);
                    handTimerInterval = null;
                }
            }

            function resetGame() {
                letters = [];
                particles = [];
                score = 0;
                miss = 0;
                frameCount = 0;
                spawnCounter = 0;
                gameActive = false;
                paused = false;
                gameOver = false;
                stopHandTimer();
                currentHand = 'left';
                handStartTime = Date.now();
                updateUI();
                pauseBtn.textContent = '⏸';
                pauseToggleBtn.textContent = '暂停';
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }
                draw();
            }

            function startGame() {
                if (gameActive && !paused && !gameOver) return;
                if (gameOver) resetGame();

                gameActive = true;
                paused = false;
                gameOver = false;
                pauseBtn.textContent = '⏸';
                pauseToggleBtn.textContent = '暂停';

                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                }
                if (letters.length === 0 && particles.length === 0 && score === 0) {
                    spawnCounter = 0;
                }
                // ★ 启动手别计时器（从左手开始，重置开始时间）
                startHandTimer();
                gameLoop();
            }

            function togglePause() {
                if (!gameActive || gameOver) return;
                paused = !paused;
                if (paused) {
                    pauseBtn.textContent = '▶';
                    pauseToggleBtn.textContent = '继续';
                    updateCountdown();  // 暂停时清除倒计时显示
                } else {
                    pauseBtn.textContent = '⏸';
                    pauseToggleBtn.textContent = '暂停';
                    if (!animationFrame) {
                        gameLoop();
                    }
                }
                draw();
            }

            function endGame() {
                gameActive = false;
                gameOver = true;
                stopHandTimer();
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }
                draw();
            }

            function gameLoop() {
                if (!gameActive || paused || gameOver) {
                    animationFrame = null;
                    return;
                }
                update();
                draw();
                animationFrame = requestAnimationFrame(gameLoop);
            }

            function update() {
                frameCount++;

                // 生成新字母
                spawnCounter++;
                if (spawnCounter >= SPAWN_INTERVAL) {
                    spawnCounter = 0;
                    if (letters.length < MAX_LETTERS_ON_SCREEN) {
                        letters.push(createLetter());
                    }
                }

                // 更新字母位置
                for (let i = letters.length - 1; i >= 0; i--) {
                    const l = letters[i];
                    l.y += l.speed;

                    if (l.y - l.radius > CH + 20) {
                        letters.splice(i, 1);
                        miss++;
                        updateUI();
                        if (miss >= 15) {
                            endGame();
                            return;
                        }
                    }
                }

                // 粒子更新
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.98;
                    p.vy *= 0.98;
                    p.life -= 0.02;
                    if (p.life <= 0 || p.y > CH + 50 || p.x < -50 || p.x > CW + 50) {
                        particles.splice(i, 1);
                    }
                }
            }

            function draw() {
                ctx.clearRect(0, 0, CW, CH);

                ctx.strokeStyle = '#18222e';
                ctx.lineWidth = 1;
                const gridSize = 50;
                for (let x = 0; x < CW; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, CH);
                    ctx.stroke();
                }
                for (let y = 0; y < CH; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(CW, y);
                    ctx.stroke();
                }

                particles.forEach(p => {
                    ctx.globalAlpha = p.life * 0.8;
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;

                letters.forEach(l => {
                    ctx.font = `bold ${l.radius * 1.6}px 'Courier New', monospace`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    ctx.shadowColor = l.color;
                    ctx.shadowBlur = 25;
                    ctx.fillStyle = l.color;
                    ctx.fillText(l.char, l.x, l.y);

                    ctx.shadowBlur = 10;
                    ctx.fillStyle = '#ffffff';
                    ctx.globalAlpha = 0.5;
                    ctx.fillText(l.char, l.x, l.y);
                    ctx.globalAlpha = 1;
                });
                ctx.shadowBlur = 0;

                if (paused && gameActive) {
                    ctx.fillStyle = 'rgba(10, 14, 20, 0.75)';
                    ctx.fillRect(0, 0, CW, CH);
                    ctx.font = 'bold 48px "Courier New", monospace';
                    ctx.fillStyle = '#b8d4ff';
                    ctx.shadowColor = '#5f9fff';
                    ctx.shadowBlur = 25;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('暂停', CW/2, CH/2);
                    ctx.shadowBlur = 0;
                }

                if (gameOver) {
                    ctx.fillStyle = 'rgba(10, 14, 20, 0.85)';
                    ctx.fillRect(0, 0, CW, CH);
                    ctx.font = 'bold 56px "Courier New", monospace';
                    ctx.fillStyle = '#ff8f8f';
                    ctx.shadowColor = '#ff0000';
                    ctx.shadowBlur = 30;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('游戏结束', CW/2, CH/2 - 40);
                    ctx.font = 'bold 28px "Courier New", monospace';
                    ctx.fillStyle = '#d0e4ff';
                    ctx.fillText(`得分: ${score}  失误: ${miss}`, CW/2, CH/2 + 50);
                    ctx.font = '22px "Courier New"';
                    ctx.fillStyle = '#9fb7d9';
                    ctx.fillText('点击「重新开始」继续练习', CW/2, CH/2 + 120);
                    ctx.shadowBlur = 0;
                }

                if (!gameActive && !gameOver && letters.length === 0 && particles.length === 0) {
                    ctx.font = 'bold 36px "Courier New", monospace';
                    ctx.fillStyle = '#8aa8d0';
                    ctx.shadowColor = '#2f4f7f';
                    ctx.shadowBlur = 15;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('点击「开始游戏」', CW/2, CH/2 - 20);
                    ctx.font = '22px "Courier New"';
                    ctx.fillStyle = '#6d8bb0';
                    ctx.fillText('练习键盘字母 · 语音朗读', CW/2, CH/2 + 50);
                    ctx.shadowBlur = 0;
                }
            }

            function handleKeyDown(e) {
                const key = e.key.toUpperCase();

                if (e.key === ' ') {
                    e.preventDefault();
                    if (gameActive && !gameOver) {
                        togglePause();
                    }
                    return;
                }

                if (!gameActive || paused || gameOver) return;

                if (!/^[A-Z]$/.test(key)) return;

                if (e.repeat) {
                    e.preventDefault();
                    return;
                }

                let targetIndex = -1;
                let maxY = -Infinity;
                for (let i = 0; i < letters.length; i++) {
                    if (letters[i].char === key && letters[i].y > maxY) {
                        maxY = letters[i].y;
                        targetIndex = i;
                    }
                }

                if (targetIndex !== -1) {
                    const target = letters[targetIndex];
                    spawnParticles(target.x, target.y, target.color);
                    letters.splice(targetIndex, 1);
                    score += 10;
                    updateUI();

                    speakLetter(key);

                    e.preventDefault();
                } else {
                    e.preventDefault();
                }
            }

            window.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'Space') {
                    e.preventDefault();
                }
            }, false);

            window.addEventListener('keydown', handleKeyDown);

            // 等级按钮
            levelBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const newLevel = parseInt(btn.dataset.level);
                    if (newLevel === level) return;
                    level = newLevel;
                    updateUI();
                    draw();
                });
            });

            startBtn.addEventListener('click', () => {
                if (!gameActive || gameOver) {
                    resetGame();
                }
                startGame();
                if (!voiceReady) initSpeech();
            });

            pauseBtn.addEventListener('click', togglePause);
            pauseToggleBtn.addEventListener('click', togglePause);

            resetBtn.addEventListener('click', () => {
                resetGame();
                startGame();
            });

            initSpeech();
            resetGame();
            draw();

            document.body.addEventListener('click', function initOnFirstClick() {
                if (!voiceReady) initSpeech();
            }, { once: true });
        })();
    </script>
</body>
</html>
